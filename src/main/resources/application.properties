spring.application.name=library-management-system
server.port=8080

# Spring Boot Auto-Configuration takes care of DataSource, EntityManager, and Web Server
spring.datasource.url=jdbc:h2:mem:librarydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 In-Memory Database Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
